<style>
/*
VOICE: a dark, hushed card duel lit by embers; fine ink lines, few hues.
IDEA: an ink-drawn grimoire table at night; every creature and card is a hand-inked sigil.
PICTURE: the battle board itself: enemy sigil above, your creature below, cards fanned at the bottom.
COLOUR and TYPE: ink black ground, paper white lines, ember orange accent, blood for the enemy, gold for artifacts. Cormorant Garamond titles, Barlow body, Barlow Condensed numbers.
LAYOUT: one full-height phone column; nothing scrolls during battle; menus scroll inside panels.
*/
:root {
  color-scheme: dark;
  --bg: #0d0c10; --panel: #17151c; --panel2: #201d26;
  --paper: #eae3d2; --dim: rgba(234,227,210,.58); --faint: rgba(234,227,210,.2);
  --ember: #ff7a3a; --ember2: #c2410c; --blood: #e0526a; --gold: #e8c26a; --frost: #9ec5e8; --ash: #9e99a6; --vow: #b894f4; --heal: #8dd996;
  --title: 'Cormorant Garamond', 'Baskerville', Georgia, serif;
  --body: 'Barlow', 'Avenir Next', system-ui, sans-serif;
  --num: 'Barlow Condensed', 'Avenir Next Condensed', system-ui, sans-serif;
  --cw: min(76px, calc((100vw - 18px) / 5.15));
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
}
:root[data-theme=light], :root[data-theme=dark] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); font: 16px/1.4 var(--body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body::before { content: ''; position: fixed; inset: auto -20% -40% -20%; height: 70%; pointer-events: none;
  background: radial-gradient(ellipse at 50% 100%, rgba(194,65,12,.22), transparent 65%); }
#embers { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.mote { position: absolute; bottom: -6px; width: 3px; height: 3px; border-radius: 50%; background: var(--ember);
  animation: rise linear forwards; opacity: 0; }
@keyframes rise { 0% { transform: translate(0,0); opacity: 0 } 10% { opacity: .8 } 100% { transform: translate(var(--dx), -100vh); opacity: 0 } }
#app { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column;
  padding: calc(var(--st) + 6px) 10px calc(var(--sb) + 8px); max-width: 520px; margin: 0 auto; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: fadein .3s ease; }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
h1, h2, h3 { font-family: var(--title); font-weight: 700; margin: 0; line-height: 1.05; text-wrap: balance; }
.center { text-align: center; }
.dim { color: var(--dim); } .faint { color: var(--faint); }
.small { font-size: 13px; }
.label { font: 700 11px var(--body); letter-spacing: .02em; color: var(--dim); }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; }
.grow { flex: 1; }

/* Buttons */
button { font: inherit; color: inherit; }
.btn { display: block; min-height: 46px; padding: 0 20px; border-radius: 14px; border: 1.4px solid var(--faint);
  background: var(--panel); color: var(--paper); font: 700 16px var(--body); cursor: pointer; transition: transform .08s; }
.btn:active { transform: scale(.96); }
.btn.primary { border-color: var(--ember); color: var(--ember); background: var(--panel2); }
.btn.danger { border-color: var(--blood); color: var(--blood); }
.btn.gold { border-color: var(--gold); color: var(--gold); background: var(--panel2); }
.btn.quiet { border-color: transparent; background: none; color: var(--dim); font-size: 14px; min-height: 40px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn:focus-visible, .card:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.stack { display: flex; flex-direction: column; gap: 12px; align-items: stretch; width: min(300px, 100%); margin: 0 auto; }

/* Menu */
.menu-hero { position: relative; flex: 1; display: grid; place-items: center; min-height: 260px; }
.menu-hero svg { position: absolute; width: min(78vw, 380px); height: auto; opacity: .55; animation: spin 120s linear infinite; }
.menu-hero .t { position: relative; text-align: center; }
.menu-hero h1 { font-size: clamp(44px, 13vw, 60px); letter-spacing: .02em; }
@keyframes spin { to { transform: rotate(360deg) } }
.foot { text-align: center; font: 700 13px var(--body); color: var(--ash); padding-top: 14px; }

/* Path */
.track { position: relative; display: flex; justify-content: space-between; align-items: center; margin: 14px 8px 4px; }
.track::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--faint); }
.dot { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--faint); }
.dot.done { background: var(--ember); } .dot.cur { width: 16px; height: 16px; background: var(--bg); border: 2px solid var(--ember); animation: pulse 1.2s ease-in-out infinite; }
.dot.aug::after { content: ''; position: absolute; left: 50%; top: -10px; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
@keyframes pulse { 50% { transform: scale(1.3) } }
.foe { flex: 1; display: grid; place-items: center; text-align: center; gap: 6px; padding: 8px 0; }
.foe svg { width: min(42vw, 170px); height: auto; animation: spin 30s linear infinite; }
.tierline { font: 700 11px var(--body); color: var(--blood); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.medal { width: 38px; height: 38px; border-radius: 50%; border: 1.4px solid rgba(232,194,106,.7); background: var(--panel2); display: grid; place-items: center; cursor: pointer; }
.medal svg { width: 26px; height: 26px; }

/* Cards */
.card { position: relative; width: var(--cw); height: calc(var(--cw) * 1.48); border-radius: 9px; background: var(--panel);
  border: 1.5px solid var(--c, var(--paper)); padding: 4px; display: flex; flex-direction: column; align-items: center;
  transition: transform .16s ease, opacity .2s; cursor: pointer; flex: none; overflow: hidden; }
.card::before { content: ''; position: absolute; left: 3px; right: 3px; top: 3px; height: 30%; border-radius: 6px; background: var(--c); opacity: .1; }
.card .cost { position: absolute; left: 3px; top: 3px; width: calc(var(--cw) * .27); height: calc(var(--cw) * .27); border-radius: 50%;
  background: var(--ember); color: var(--bg); font: 700 calc(var(--cw) * .2) var(--num); display: grid; place-items: center; }
.card .nm { position: relative; font: 700 calc(var(--cw) * .135) var(--title); line-height: 1.02; text-align: center; height: 2.1em;
  display: flex; align-items: center; justify-content: center; padding-left: calc(var(--cw) * .22); width: 100%; }
.card .art { width: 44%; height: auto; margin: 1px 0; opacity: .9; }
.card .ty { font: 700 calc(var(--cw) * .082) var(--body); color: var(--c); opacity: .85; white-space: nowrap; }
.card .tx { font: 600 calc(var(--cw) * .112) var(--body); line-height: 1.12; text-align: center; margin-top: 2px; }
.card.cr .tx { font-size: calc(var(--cw) * .095); }
.card .p, .card .h { position: absolute; bottom: 3px; width: calc(var(--cw) * .25); height: calc(var(--cw) * .25); border-radius: 50%;
  display: grid; place-items: center; font: 700 calc(var(--cw) * .19) var(--num); color: var(--bg); }
.card .p { left: 3px; background: var(--ember); } .card .h { right: 3px; background: var(--paper); }
.card.big { --cw: min(118px, calc((100vw - 52px) / 3)); }
.card.sel { transform: translateY(-20px); box-shadow: 0 0 0 2px var(--ember), 0 8px 24px rgba(255,122,58,.35); z-index: 50; }
.card.off { opacity: .5; }
.card.picked { box-shadow: 0 0 0 2.5px var(--gold); }

/* Battle */
.bt { flex: 1; display: grid; grid-template-rows: auto auto 1fr auto auto auto; min-height: 0; gap: 4px; }
.etop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.ename { text-align: center; }
.ename h2 { font-size: 22px; }
.round { text-align: center; }
.round b { display: block; font: 700 30px/1 var(--num); }
.intent { border: 1.3px solid rgba(224,82,106,.6); border-radius: 12px; background: var(--panel); padding: 5px 6px; text-align: center; }
.intent b { display: block; font: 700 16px var(--body); }
.intent span { font-size: 10.5px; color: var(--dim); }
.cmd { display: grid; place-items: center; position: relative; }
.cmd svg { width: 82px; height: 82px; animation: spin 40s linear infinite; }
.hpbar { position: relative; width: 160px; height: 16px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--faint); margin: 4px auto 0; overflow: hidden; }
.hpbar i { position: absolute; inset: 1px auto 1px 1px; border-radius: 7px; background: var(--blood); transition: width .25s; }
.hpbar b { position: relative; display: block; text-align: center; font: 700 12px/14px var(--num); }
.estatus { text-align: center; font: 700 11px var(--body); color: var(--vow); min-height: 15px; }
.eblock { position: absolute; left: calc(50% - 112px); bottom: 10px; }
.board { display: grid; grid-template-rows: 1fr 1px 1fr auto; gap: 6px; min-height: 0; }
.lane { display: grid; grid-template-columns: 1fr minmax(0, 150px) 1fr; align-items: center; gap: 6px; min-height: 0; }
.slot { position: relative; height: 100%; min-height: 104px; max-height: 128px; border: 1.3px dashed var(--faint); border-radius: 14px;
  display: grid; place-items: center; }
.slot.enemy { border-color: rgba(224,82,106,.25); }
.slot .empty { font: 700 10px var(--body); color: var(--faint); }
.ally { position: absolute; inset: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ally svg { width: 58px; height: 58px; animation: breathe 2.6s ease-in-out infinite; }
.ally .an { font: 700 13px var(--title); margin-top: 2px; }
.ally .fresh { position: absolute; top: 0; font: 700 8px var(--body); color: var(--dim); }
.ally .p, .ally .h { position: absolute; bottom: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font: 700 17px var(--num); color: var(--bg); border: 1.5px solid var(--bg); }
.ally .p { left: 0; background: var(--ember); } .ally .h { right: 0; background: var(--paper); }
.ally.enemy .p { background: var(--blood); }
@keyframes breathe { 50% { transform: scale(1.05) } }
.divider { background: var(--faint); margin: 0 20px; }
.side-btn { justify-self: center; display: grid; place-items: center; width: 70px; height: 70px; border-radius: 50%;
  border: 2px solid var(--faint); background: var(--panel); text-align: center; cursor: pointer; padding: 0; transition: transform .08s; }
.side-btn:active { transform: scale(.94); }
.side-btn b { display: block; font: 700 10px var(--body); }
.side-btn svg { width: 22px; height: 22px; margin-bottom: -2px; }
.side-btn.off { opacity: .42; }
.side-btn.ready { border-color: var(--ember); background: rgba(194,65,12,.3); box-shadow: 0 0 16px rgba(255,122,58,.55); animation: pulse 1s ease-in-out infinite; }
.side-cap { text-align: center; font: 700 8.5px var(--body); color: var(--dim); margin-top: 3px; }
.pips { display: flex; gap: 5px; justify-content: center; margin-bottom: 4px; }
.pips i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ash); }
.pips i.on { background: var(--ember); border-color: var(--ember); }
.arts { display: flex; justify-content: center; gap: 12px; padding: 2px 0; }
.art-slot { width: 42px; height: 42px; border-radius: 50%; border: 1.2px solid rgba(232,194,106,.18); display: grid; place-items: center; position: relative; }
.art-slot.has { border-color: rgba(232,194,106,.85); background: var(--panel2); cursor: pointer; }
.art-slot svg { width: 30px; height: 30px; }
.art-slot .ch { position: absolute; right: -4px; top: -4px; width: 17px; height: 17px; border-radius: 50%; background: var(--gold); color: var(--bg); font: 700 11px/17px var(--num); text-align: center; }
.status { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 10px; padding: 4px 2px; }
.stat { display: flex; align-items: center; gap: 4px; font: 700 20px var(--num); }
.stat svg { width: 18px; height: 18px; }
.stat.low { color: var(--blood); }
.energy { color: var(--ember); justify-self: center; }
.endturn { min-height: 42px; padding: 0 16px; }
.piles { display: flex; justify-content: space-between; font: 700 10px var(--body); color: var(--dim); padding: 0 4px; }
.piles button { background: none; border: 0; color: inherit; font: inherit; padding: 4px; cursor: pointer; }
.hint { color: var(--ember); }
.hand { position: relative; height: calc(var(--cw) * 1.48 + 24px); display: flex; justify-content: center; align-items: flex-end; padding-bottom: 2px; }
.hand .card { margin-left: var(--ov, 4px); }
.hand .card:first-child { margin-left: 0; }
.hand .card.new { animation: deal .25s ease; }
@keyframes deal { from { transform: translate(-40px, 30px); opacity: 0 } }
.shake { animation: shake .3s; }
@keyframes shake { 20% { transform: translateX(-6px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } }
.lunge-up { animation: lungeUp .2s; } .lunge-down { animation: lungeDown .2s; }
@keyframes lungeUp { 50% { transform: translateY(-26px) } } @keyframes lungeDown { 50% { transform: translateY(26px) } }
.pop { animation: pop .25s; } @keyframes pop { 50% { transform: scale(1.3) } }
.die { animation: die .26s forwards; } @keyframes die { to { transform: scale(.3); opacity: 0 } }
.float { position: fixed; z-index: 90; font: 700 24px var(--num); pointer-events: none; transform: translate(-50%, -50%); animation: floatUp .8s ease-out forwards; text-shadow: 0 2px 8px #000; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7) } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1) } 100% { opacity: 0; transform: translate(-50%, -160%) } }
.flash { position: fixed; inset: 0; z-index: 80; pointer-events: none; animation: flash .4s forwards; }
@keyframes flash { from { opacity: var(--a, .2) } to { opacity: 0 } }
.banner { position: fixed; left: 50%; top: var(--y, 50%); transform: translate(-50%, -50%); z-index: 95; max-width: calc(100vw - 30px);
  background: rgba(13,12,16,.95); border: 1.3px solid var(--bc, var(--paper)); color: var(--bc, var(--paper)); border-radius: 12px;
  padding: 10px 16px; font: 700 15px var(--body); text-align: center; pointer-events: none; animation: banner var(--t, 1s) forwards; }
@keyframes banner { 0% { opacity: 0 } 10%, 75% { opacity: 1 } 100% { opacity: 0 } }

/* Reward / augments / shrine */
.panel { border: 1.4px solid var(--faint); border-radius: 14px; background: var(--panel); padding: 10px; cursor: pointer; }
.panel.sel { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); }
.panel.gold { border-color: rgba(232,194,106,.45); }
.panel.gold.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.panel .cards { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
.list { display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 10px; }
.aug { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.aug .medal { width: 48px; height: 48px; } .aug .medal svg { width: 32px; height: 32px; }
.aug b { font: 700 18px var(--title); color: var(--gold); display: block; }
.unlock { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.unlock b { font: 700 17px var(--title); display: block; }
.unlock .btn { min-height: 38px; padding: 0 14px; font-size: 14px; }
.owned { color: var(--ember); font: 700 13px var(--body); }
.howto h3 { color: var(--ember); font-size: 20px; margin: 14px 0 4px; }
.howto p { margin: 0; font-size: 15px; }
.gl { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; font-size: 14px; }
.gl b { font-weight: 700; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.78); display: flex; flex-direction: column;
  padding: calc(var(--st) + 12px) 10px calc(var(--sb) + 12px); animation: fadein .15s; }
.modal .inner { max-width: 520px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 10px; }
.grid { --cw: min(110px, calc((min(100vw, 520px) - 44px) / 3)); display: grid; grid-template-columns: repeat(3, var(--cw)); gap: 8px; justify-content: center; }
.grid .card { cursor: default; }
.toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 200px); transform: translateX(-50%); z-index: 120; max-width: calc(100vw - 30px);
  background: rgba(13,12,16,.96); border: 1.3px solid var(--tc, var(--paper)); color: var(--tc, var(--paper)); border-radius: 12px;
  padding: 10px 14px; font: 700 14px var(--body); text-align: center; animation: banner 2.2s forwards; pointer-events: none; }
.loading { flex: 1; display: grid; place-items: center; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; } }
@media (max-height: 700px) { .cmd svg { width: 64px; height: 64px; } .slot { min-height: 92px; } .ename h2 { font-size: 19px; } }
/* Empower: grown numbers, stars, big-hit juice */
.card .tx b.up { color: var(--gold); font-weight: 800; }
.card .stars { color: var(--gold); letter-spacing: -.5px; text-shadow: 0 0 6px rgba(232,194,106,.7); margin-right: 3px; }
.card.lv { box-shadow: 0 0 0 1.5px rgba(232,194,106,.55), 0 0 14px rgba(232,194,106,.18); }
.card .p.up, .card .h.up { box-shadow: 0 0 0 2px var(--gold); }
.combo { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); text-align: right; pointer-events: none; color: var(--ember); transition: opacity .3s; }
.combo b { display: block; font: 800 var(--cs, 26px)/1 var(--num); text-shadow: 0 0 14px rgba(255,122,58,.55), 0 2px 6px #000; transition: font-size .15s; }
.combo span { font: 700 8.5px var(--body); color: var(--ash); letter-spacing: .5px; }
.combo.hot b { color: var(--gold); }
.quake { animation: quake .32s; }
@keyframes quake { 15% { transform: translate(-7px, 4px) } 30% { transform: translate(7px, -5px) } 45% { transform: translate(-5px, -3px) } 60% { transform: translate(5px, 4px) } 80% { transform: translate(-2px, 1px) } }
.float.crit { font-weight: 800; color: var(--gold) !important; text-shadow: 0 0 16px rgba(255,122,58,.9), 0 2px 8px #000; }
.emp-pick .card { cursor: pointer; }
.emp-pick .card.sel { transform: translateY(-4px); }
.emp-prev { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 120px; margin: 4px 0 8px; }
.emp-prev .arrow { font: 800 26px var(--num); color: var(--gold); }
.best { font: 700 15px var(--body); color: var(--gold); margin-top: 6px; }

<script>
// Ashbound rules, ported from the Swift version (Core/*.swift). No DOM here.
const Core = (() => {
  // ---------- RNG (mulberry32; state is a plain number so it saves easily) ----------
  class RNG {
    constructor(seed) { this.s = (seed >>> 0) || 0x9e3779b9; }
    next() {
      let t = (this.s = (this.s + 0x6d2b79f5) >>> 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    int(lo, hiExclusive) { return lo + Math.floor(this.next() * (hiExclusive - lo)); }
    chance(p) { return this.next() < p; }
    pick(a) { return a.length ? a[Math.floor(this.next() * a.length)] : undefined; }
    shuffle(a) {
      const b = a.slice();
      for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
      return b;
    }
  }

  // ---------- Cards ----------
  // Numbers in {braces} are the card's power numbers: Empower (stars) scales them by +50% per star.
  const THEMES = {
    starter: ['Starter', ''], embers: ['Embers', 'Direct damage'], bulwark: ['Bulwark', 'Block and walls'],
    swarm: ['Swarm', 'Creatures that die for value'], artifice: ['Artifice', 'Lasting artifacts'],
    scorch: ['Scorch', 'Damage over time'], giants: ['Giants', 'Big creatures and buffs'], pyre: ['Pyre', 'Ash and Burn'],
    hex: ['Hex', 'Curses and counters'], spellbound: ['Spellbound', 'Chain spells into one huge turn'],
    bloodrite: ['Bloodrite', 'Pay HP, drain it back'], echoes: ['Echoes', 'Recycle your used pile'],
    legendary: ['Legendary', ''],
  };
  const C = [];
  const nums = text => (text.match(/\{\d+\}/g) || []).map(x => +x.slice(1, -1));
  const spell = (id, name, cost, theme, text, o = {}) =>
    C.push({ id, name, cost, type: 'spell', theme, text, nums: nums(text), power: 0, health: 0, needsAlly: !!o.needsAlly, damaging: !!o.damaging, charges: 0 });
  const creature = (id, name, cost, theme, p, h, text = '') =>

    }
    has(id) { return this.artifacts.some(a => a.id === id); }

    get ashNeeded() { return this.aug.has('hotCoals') ? 2 : 3; }
    get canBurn() { return this.outcome === 'ongoing' && this.ash >= this.ashNeeded; }

    get stokePrice() { return this.aug.has('ashCrown') ? 1 : STOKE_COST; }

    canPlay(c) {

      for (const a of this.artifacts.slice()) {

        if (art.id === 'cinderLamp') { this.ev('artifactFires', { uid: art.uid }); this.hitFront('enemy', this.N(art)); }

      } else if (this.intent) this.execute(this.intent);
      if (this.outcome !== 'ongoing') return;
      const m = this.allies.enemy;
      if (m && !m.fresh && m.power > 0) {
        this.ev('allyAttacks', { side: 'enemy' });
        this.enemyAttack(m.power, false);
        if (this.outcome !== 'ongoing') return;
      }
      if (this.allies.enemy && this.allies.enemy.fresh) this.allies.enemy.fresh = false;
      if (this.weaken !== 0 || this.exposed) { this.weaken = 0; this.exposed = false; this.ev('status'); }
      this.rollIntent(this.round + 1);
      this.beginTurn();
    }

    resolve(c, spellsBefore = 0) {
      const sb = this.spellBonus, n = i => this.N(c, i);
      switch (c.id) {
        case 'strike': case 'emberBolt': case 'searingBolt': case 'firestorm': case 'inferno': this.hitFront('enemy', n(0) + sb); break;
        case 'flameJab': this.hitFront('enemy', n(0) + sb); this.draw(1); break;
        case 'twinFlames': this.hitFront('enemy', n(0) + sb); if (this.outcome === 'ongoing') this.hitFront('enemy', n(0) + sb); break;
        case 'fireball': { const e = this.energy; this.energy = 0; this.ev('energy'); if (e > 0) this.hitFront('enemy', n(0) * e + sb); break; }
        case 'ashBlade': this.hitFront('enemy', n(0) + sb); this.gainAsh(1); break;
        case 'guardUp': case 'brace': case 'ironSkin': this.gainBlock(n(0)); break;
        case 'secondWind': this.gainBlock(n(0)); this.draw(1); break;
        case 'shieldBash': this.hitFront('enemy', this.block + sb); break;
        case 'kindle': this.killAlly('player'); if (this.outcome === 'ongoing') this.draw(2); break;
        case 'swarmCall':
          if (this.allies.player) this.killAlly('player');
          if (this.outcome === 'ongoing') this.summonPlayer('cinderMoth', c.lvl);
          break;
        case 'fanFlames': this.buffAlly(n(0), 0); break;
        case 'battleCry': this.buffAlly(n(0), n(1)); break;
        case 'stokeSpark': this.gainAsh(1); this.draw(1); break;
        case 'lastRites': this.killAlly('player'); this.gainAsh(this.ashNeeded); break;
        case 'heatUp': this.heat += n(0); this.ev('info', { text: `Burn now deals ${this.burnDamage}.` }); break;
        case 'weaken': this.weaken += n(0); this.ev('status'); break;
        case 'rot': this.rotDmg += n(0); this.ev('status'); break;
        case 'expose':
          this.exposed = true;
          if (this.enemyBlock > 0) { this.enemyBlock = 0; this.ev('block', { side: 'enemy', value: 0 }); }
          this.ev('status'); this.draw(1); break;
        case 'turncoat': {
          const m = this.allies.enemy;
          if (m) {
            this.ev('allyAttacks', { side: 'enemy' });
            this.ev('info', { text: `${m.name} turns on its master!` });
            this.hitFace('enemy', m.power * n(0));
            this.killAlly('enemy');
          }
          break;
        }
        case 'smother': this.smothered = true; this.ev('status'); break;
        case 'emberDart': case 'smokeCloud': this.applyScorch(n(0)); break;
        case 'catalyst': this.applyScorch(this.scorch); break;
        case 'wildfire': if (this.scorch > 0) this.hitFace('enemy', this.scorch + sb, true); this.applyScorch(n(0)); break;
        case 'glimmer': this.draw(1); break;
        case 'ritual': this.energy += 3; this.ev('energy'); break;
        case 'spellstorm': if (spellsBefore > 0) this.hitFront('enemy', n(0) * spellsBefore + sb); else this.ev('info', { text: 'No other spells cast this turn.' }); break;
        case 'leechBite': this.hitFront('enemy', n(0) + sb); this.healPlayer(n(0) + sb); break;
        case 'bloodPact': this.loseHP(3); if (this.outcome === 'ongoing') this.draw(2); break;
        case 'crimsonPact': this.loseHP(5); this.hitFront('enemy', n(0) + sb); break;
        case 'martyrsFury': this.hitFront('enemy', this.maxHP - this.hp + sb); break;
        case 'boneHarvest': this.hitFront('enemy', n(0) * this.discard.length + sb); break;
        case 'recall': {
          for (let i = this.discard.length - 1; i >= 0; i--) {
            const x = this.discard[i];
            if (x.uid !== c.uid && x.id !== 'recall' && card(x.id).type === 'spell') {
              if (this.hand.length < 10) { this.hand.push(this.discard.splice(i, 1)[0]); this.ev('hand'); }
              break;
            }
          }
          break;
        }
      }
    }

    applyScorch(n) {
      if (n <= 0 || this.outcome !== 'ongoing') return;
      this.scorch += n + (this.aug.has('kindledWounds') ? 2 : 0);
      this.ev('status');
    }
    loseHP(n) { this.hitFace('player', n, true); }

    buffAlly(p, h) {
      const a = this.allies.player;
      if (!a) return;
      a.power += p; a.health += h; a.maxHealth += h;
      this.ev('allyChanged', { side: 'player' });
    }

    placeArtifact(c) {
      if (this.artifacts.length >= MAX_ARTIFACTS) {
        const old = this.artifacts.shift();
        this.ev('info', { text: `${card(old.id).name} is replaced.` });
      }
      this.artifacts.push({ uid: c.uid, id: c.id, lvl: c.lvl || 0, charges: card(c.id).charges });
      this.ev('artifacts');
    }

    summonPlayer(id, lvl = 0, srcUid = null) {
      const d = card(id);
      let [p, h] = stats(id, lvl);
      if (this.aug.has('graveLantern')) { p += 2; h += 2; }
      const o = { cardID: id, lvl };
      if (id === 'clockworkGolem') { p += this.N(o, 0) * this.artifacts.length; h += this.N(o, 1) * this.artifacts.length; }
      if (id === 'ghoul') { p += this.N(o, 0) * this.discard.length; h += this.N(o, 1) * this.discard.length; }
      this.allies.player = { id: this.nextID++, name: d.name, side: 'player', power: p, health: h, maxHealth: h, cardID: id, lvl, srcUid, minion: null, fresh: false };
      this.ev('allyIn', { side: 'player' });
    }
    summonToken(name, p, h) {
      if (this.aug.has('graveLantern')) { p += 2; h += 2; }
      this.allies.player = { id: this.nextID++, name, side: 'player', power: p, health: h, maxHealth: h, cardID: null, lvl: 0, minion: null, fresh: false };
      this.ev('allyIn', { side: 'player' });
    }
    summonMinion(m) {
      const [name, bp, bh] = MINIONS[m];
      const p = bp + Math.floor((this.round - 1) / 3), h = bh + Math.floor((this.round - 1) / 2);
      this.allies.enemy = { id: this.nextID++, name, side: 'enemy', power: p, health: h, maxHealth: h, cardID: null, minion: m, fresh: true };
      this.ev('allyIn', { side: 'enemy' });
    }

    hitFront(side, amount) {
      if (amount <= 0 || this.outcome !== 'ongoing') return;
      if (this.allies[side]) {
        const over = this.hitAlly(side, amount);
        if (over > 0) this.hitFace(side, over);
      } else this.hitFace(side, amount);
    }
    tally(side, n) { if (side === 'enemy' && n > 0) { this.turnDamage += n; this.bestTurn = Math.max(this.bestTurn, this.turnDamage); } }
    hitAlly(side, amount) {
      const a = this.allies[side];
      if (!a || amount <= 0) return 0;
      if (amount >= a.health) {
        const over = amount - a.health;
        this.tally(side, a.health);
        this.ev('allyHit', { side, amount: a.health, newHealth: 0 });
        this.killAlly(side);
        return over;
      }
      a.health -= amount;
      this.tally(side, amount);
      this.ev('allyHit', { side, amount, newHealth: a.health });
      return 0;
    }
    enemyAttack(raw, skipAlly) {
      let dmg = Math.max(0, raw - this.weaken);
      const i = this.artifacts.findIndex(a => a.id === 'mirrorShard');
      if (i >= 0) {
        const s = this.artifacts[i];
        dmg = Math.max(0, dmg - this.N(s));
        s.charges--;
        this.ev('artifactFires', { uid: s.uid });
        if (s.charges <= 0) { this.artifacts.splice(i, 1); this.ev('info', { text: 'Mirror Shard shatters.' }); }
        this.ev('artifacts');
      }
      if (skipAlly) this.hitFace('player', dmg); else this.hitFront('player', dmg);
    }
    hitFace(side, amount, ignoreBlock = false) {
      if (amount <= 0 || this.outcome !== 'ongoing') return;
      let a = amount;
      if (!ignoreBlock) {
        const key = side === 'player' ? 'block' : 'enemyBlock';
        if (this[key] > 0) {
          const ab = Math.min(this[key], a);
          a -= ab; this[key] -= ab;
          this.ev('block', { side, value: this[key] });
        }
      }
      if (a > 0) {
        if (side === 'player') this.hp -= a; else this.enemyHP -= a;
        this.tally(side, a);
        this.ev('faceHit', { side, amount: a });
      }
      if (side === 'player' && this.hp <= 0 && this.aug.has('phoenixFeather') && !this.featherUsed) {
        this.featherUsed = true;
        const back = 10 - this.hp;
        this.hp = 10;
        this.ev('healed', { side: 'player', amount: back });
        this.ev('info', { text: 'Phoenix Feather! You survive at 10 HP.' });
      }
      this.checkOutcome();
    }
    killAlly(side) {
      const a = this.allies[side];
      if (!a) return;
      this.allies[side] = null;
      this.ev('allyDied', { side });
      if (side !== 'player') return;
      this.gainAsh(1);
      if (this.aug.has('mourningVeil')) this.gainBlock(5);
      for (const art of this.artifacts.slice()) {
        if (this.outcome !== 'ongoing') break;
        if (art.id === 'boneAltar') { this.ev('artifactFires', { uid: art.uid }); this.hitFront('enemy', this.N(art)); }
        else if (art.id === 'graveBell') { this.ev('artifactFires', { uid: art.uid }); this.hitFront('enemy', a.power); }
        else if (art.id === 'soulFurnace') { this.ev('artifactFires', { uid: art.uid }); this.energy++; this.ev('energy'); this.draw(1); }
      }
      if (a.cardID === 'cinderMoth') this.hitFront('enemy', this.N(a));
      else if (a.cardID === 'emberFox') this.draw(1);
      else if (a.cardID === 'phoenix') this.gainAsh(2);
      else if (a.cardID === 'broodMother' && this.outcome === 'ongoing' && !this.allies.player) this.summonPlayer('cinderMoth', a.lvl);
      else if (a.cardID === 'restless' && a.srcUid != null && this.hand.length < 10) {
        const i = this.discard.findIndex(x => x.uid === a.srcUid);
        if (i >= 0) { this.hand.push(this.discard.splice(i, 1)[0]); this.ev('hand'); }
      }
      this.checkOutcome();
    }
    gainAsh(n) {
      if (n <= 0) return;
      this.ashGainedTotal += n;
      const before = this.ash;
      this.ash = Math.min(this.ashNeeded, this.ash + n);
      if (this.ash !== before) this.ev('ash');
    }
    gainBlock(n) { if (n > 0) { this.block += n; this.ev('block', { side: 'player', value: this.block }); } }
    healPlayer(n) {
      const a = Math.min(n, this.maxHP - this.hp);
      if (a <= 0) return;
      this.hp += a; this.ev('healed', { side: 'player', amount: a });
      for (const art of this.artifacts.slice()) {
        if (art.id === 'chalice' && this.outcome === 'ongoing') { this.ev('artifactFires', { uid: art.uid }); this.hitFront('enemy', a); }
      }
    }

    ramp(r, k = 1) { return Math.floor((r - 1) * TUNING[this.enemy.tier][1] * k); }
    rollIntent(r) {
      const t = this.enemy.pattern[this.patternIndex % this.enemy.pattern.length];
      this.patternIndex++;
      switch (t.kind) {
        case 'attack': this.intent = { kind: 'attack', amount: t.amount + (t.hits > 1 ? this.ramp(r, 0.5) : this.ramp(r)), hits: t.hits || 1 }; break;
        case 'lunge': this.intent = { kind: 'lunge', amount: t.amount + this.ramp(r, 0.8), hits: 1 }; break;
        case 'block': case 'heal': this.intent = { kind: t.kind, amount: t.amount + this.ramp(r, 1.5), hits: 1 }; break;
        case 'enrage': case 'wither': this.intent = { kind: t.kind, amount: t.amount, hits: 1 }; break;
        case 'shatter': this.intent = { kind: 'shatter', amount: 0, hits: 1 }; break;
        case 'summon':
          this.intent = !this.allies.enemy ? { kind: 'summon', amount: 0, hits: 1, minion: t.minion }
                                           : { kind: 'attack', amount: 3 + this.ramp(r), hits: 1 };
          break;
      }
    }
    execute(i) {
      const n = this.enemy.name;
      switch (i.kind) {
        case 'attack':
          this.ev('enemyActs', { text: `${n} attacks!` });
          for (let k = 0; k < i.hits && this.outcome === 'ongoing'; k++) this.enemyAttack(i.amount + this.enrage, false);
          break;
        case 'lunge':
          this.ev('enemyActs', { text: `${n} lunges past your creature!` });
          this.enemyAttack(i.amount + this.enrage, true);
          break;
        case 'block':
          if (this.exposed) this.ev('enemyActs', { text: `${n} can't Block (Exposed).` });
          else { this.ev('enemyActs', { text: `${n} gains ${i.amount} Block.` }); this.enemyBlock += i.amount; this.ev('block', { side: 'enemy', value: this.enemyBlock }); }
          break;
        case 'heal': {
          this.ev('enemyActs', { text: `${n} heals ${i.amount}.` });
          const a = Math.min(i.amount, this.enemyMaxHP - this.enemyHP);
          if (a > 0) { this.enemyHP += a; this.ev('healed', { side: 'enemy', amount: a }); }
          break;
        }
        case 'enrage': this.ev('enemyActs', { text: `${n} enrages: attacks +${i.amount}.` }); this.enrage += i.amount; this.ev('status'); break;
        case 'wither':
          this.ev('enemyActs', { text: `${n} withers your creature: −${i.amount} attack.` });
          if (this.allies.player) { this.allies.player.power = Math.max(0, this.allies.player.power - i.amount); this.ev('allyChanged', { side: 'player' }); }
          break;
        case 'shatter':
          if (!this.artifacts.length) this.ev('enemyActs', { text: `${n} finds no artifact to destroy.` });
          else { const old = this.artifacts.shift(); this.ev('enemyActs', { text: `${n} destroys your ${card(old.id).name}!` }); this.ev('artifacts'); }
          break;
        case 'summon':
          if (!this.allies.enemy && i.minion) { this.ev('enemyActs', { text: `${n} summons a ${MINIONS[i.minion][0]}.` }); this.summonMinion(i.minion); }
          break;
      }
    }
    intentText() {
      const i = this.intent;
      if (!i) return ['', ''];
      if (this.smothered) return ['Countered', 'Skips its next action'];
      const w = this.weaken > 0 ? ` (−${this.weaken})` : '';
      switch (i.kind) {
        case 'attack': { const n = Math.max(0, i.amount + this.enrage - this.weaken); return [i.hits > 1 ? `Attack ${n}×${i.hits}` : `Attack ${n}`, 'Hits your creature first' + w]; }
        case 'lunge': return [`Lunge ${Math.max(0, i.amount + this.enrage - this.weaken)}`, 'Skips your creature' + w];
        case 'block': return [`Block ${i.amount}`, this.exposed ? "Can't Block (Exposed)" : 'Gains Block'];
        case 'heal': return [`Heal ${i.amount}`, 'Heals itself'];
        case 'enrage': return [`Enrage +${i.amount}`, 'Its attacks grow for good'];
        case 'wither': return [`Wither ${i.amount}`, 'Your creature loses attack'];
        case 'shatter': return ['Shatter', this.artifacts.length ? 'Destroys your oldest artifact' : 'You have no artifact'];
        case 'summon': {
          const [name, bp, bh] = MINIONS[i.minion];
          return ['Summon', `Summons a ${name} ${bp + Math.floor((this.round - 1) / 3)}/${bh + Math.floor((this.round - 1) / 2)}`];
        }
      }
      return ['', ''];
    }
    get enemyStatus() {
      const p = [];
      if (this.enrage > 0) p.push(`Enraged +${this.enrage}`);
      if (this.scorch > 0) p.push(`Scorch ${this.scorch}`);
      if (this.rotDmg > 0) p.push(`Rot ${this.rotDmg}/turn`);
      if (this.weaken > 0) p.push(`Weak −${this.weaken}`);
      if (this.exposed) p.push('Exposed');
      return p.join(' · ');
    }
    checkOutcome() {
      if (this.outcome !== 'ongoing') return;
      if (this.enemyHP <= 0) { this.enemyHP = 0; this.outcome = 'won'; }
      else if (this.hp <= 0) { this.hp = 0; this.outcome = 'lost'; }
    }
    takeEvents() { const e = this.events; this.events = []; return e; }
  }

  // ---------- Meta (permanent unlocks) ----------
  const UNLOCKS = [
    ['vitality1', 'Vitality I', '+3 max HP.', 40, null],
    ['themeGiants', 'Giants', 'Adds the Giants theme: big creatures and buffs.', 50, null],
    ['hotterBurn', 'Hotter Burn I', 'Burn deals +2 damage.', 60, null],
    ['themeHex', 'Hex', 'Adds the Hex theme: curses and counters.', 70, null],
    ['widerChoice', 'Wider Choice', 'Choose from 4 card bundles instead of 3.', 80, null],
    ['vitality2', 'Vitality II', '+3 max HP.', 100, 'vitality1'],
    ['themePyre', 'Pyre', 'Adds the Pyre theme: Ash and Burn.', 90, null],
    ['treasureHunter', 'Treasure Hunter', 'Choose from 4 Augments instead of 3.', 110, null],
    ['headStart', 'Head Start', 'Start each run with a random Augment.', 150, null],
    ['hotterBurn2', 'Hotter Burn II', 'Burn deals +2 damage.', 120, 'hotterBurn'],
    ['vitality3', 'Vitality III', '+3 max HP.', 160, 'vitality2'],
  ].map(([id, name, detail, cost, requires]) => ({ id, name, detail, cost, requires }));

  const newMeta = () => ({ ash: 0, lifetimeAsh: 0, unlocked: [], runs: 0, wins: 0, bestFight: 0, bestTurn: 0, soundOn: true, seenTutorial: false });
  const Meta = {
    vitality: m => ['vitality1', 'vitality2', 'vitality3'].filter(u => m.unlocked.includes(u)).length,
    burnBonus: m => ['hotterBurn', 'hotterBurn2'].filter(u => m.unlocked.includes(u)).length * 2,
    themes: m => {
      const t = ['embers', 'bulwark', 'swarm', 'artifice', 'scorch', 'spellbound', 'bloodrite', 'echoes'];
      if (m.unlocked.includes('themeHex')) t.push('hex');
      if (m.unlocked.includes('themeGiants')) t.push('giants');
      if (m.unlocked.includes('themePyre')) t.push('pyre');
      return t;
    },
    canBuy: (m, u) => !m.unlocked.includes(u.id) && m.ash >= u.cost && (!u.requires || m.unlocked.includes(u.requires)),
    buy: (m, u) => { if (!Meta.canBuy(m, u)) return false; m.ash -= u.cost; m.unlocked.push(u.id); return true; },
    bank: (m, n) => { m.ash += n; m.lifetimeAsh += n; },
  };

  // ---------- Run ----------
  const AUGMENT_AFTER = [2, 4, 6];
  const Run = {
    create(meta, seed) {
      const rng = new RNG(seed);
      const r = { rngState: 0, maxHP: 30 + 3 * Meta.vitality(meta), deck: STARTER.slice(), stars: STARTER.map(() => 0), augments: [], fight: 1, opponents: [],
                  stage: 'preFight', ashEarned: 0, pendingBundles: [], pendingAugments: [], pendingArtifact: null, empowersLeft: 0, bestTurn: 0 };
      r.opponents = [...rng.shuffle(enemiesOfTier(1)).slice(0, 2), ...rng.shuffle(enemiesOfTier(2)).slice(0, 3),
                     ...rng.shuffle(enemiesOfTier(3)).slice(0, 2), rng.shuffle(enemiesOfTier(4))[0]];
      if (meta.unlocked.includes('headStart')) r.augments.push(rng.pick(AUGMENT_IDS));
      r.rngState = rng.s;
      return r;
    },
    // Older saves have no stars: fill them in.
    fix(r) { if (!r) return r; r.stars = r.stars || []; while (r.stars.length < r.deck.length) r.stars.push(0); r.bestTurn = r.bestTurn || 0; r.empowersLeft = r.empowersLeft || 0; return r; },
    deckCards: r => r.deck.map((id, i) => ({ id, lvl: (r.stars && r.stars[i]) || 0 })),
    empowerable: r => r.deck.map((id, i) => i).filter(i => canEmpower(r.deck[i]) && (r.stars[i] || 0) < MAX_STARS),
    rng(r) { const g = new RNG(1); g.s = r.rngState; return g; },
    save(r, g) { r.rngState = g.s; },
    currentEnemy: r => r.opponents[Math.min(r.fight, r.opponents.length) - 1],
    isFinal: r => r.fight >= TOTAL_FIGHTS,
    nextSeed(r) { const g = Run.rng(r); const s = Math.floor(g.next() * 4294967296); Run.save(r, g); return s; },
    winFight(r, b, meta) {
      r.ashEarned += b.ashGainedTotal;
      r.bestTurn = Math.max(r.bestTurn || 0, b.bestTurn || 0);
      const g = Run.rng(r);
      const themes = g.shuffle(Meta.themes(meta)).slice(0, meta.unlocked.includes('widerChoice') ? 4 : 3);
      r.pendingBundles = themes.map(t => {
        const pool = cardsOf(t);
        const picks = [];
        let tries = 0;
        while (picks.length < 3 && tries < 40) {
          tries++;
          const c = g.pick(pool);
          if (c.cost >= 5 && r.fight < 3 && g.chance(0.7)) continue;
          if (picks.includes(c.id) && g.chance(0.6)) continue;
          picks.push(c.id);
        }
        return { theme: t, cards: picks.sort((a, b) => card(a).cost - card(b).cost) };
      });
      const owned = new Set(r.deck);
      r.pendingArtifact = g.pick(cardsOf('legendary').map(c => c.id).filter(id => !owned.has(id))) || null;
      r.stage = 'bundle';
      Run.save(r, g);
    },

    takeArtifact(r, meta) { Run.fix(r); if (r.pendingArtifact) { r.deck.push(r.pendingArtifact); r.stars.push(0); } return Run.takeBundle(r, null, meta); },
    takeBundle(r, bundle, meta) {
      Run.fix(r);
      if (bundle) { r.deck.push(...bundle.cards); r.stars.push(...bundle.cards.map(() => 0)); }
      r.pendingBundles = []; r.pendingArtifact = null;
      r.empowersLeft = r.augments.includes('forgeMaster') ? 2 : 1;
      r.stage = 'empower';
      return 'empower';
    },
    // Empower one card (deck index), or null to skip. Returns the next stage.
    takeEmpower(r, idx, meta) {
      Run.fix(r);
      if (idx != null && Run.empowerable(r).includes(idx)) r.stars[idx]++;
      r.empowersLeft = idx == null ? 0 : r.empowersLeft - 1;
      if (r.empowersLeft > 0 && Run.empowerable(r).length) return 'empower';
      r.empowersLeft = 0;
      if (AUGMENT_AFTER.includes(r.fight)) {
        const g = Run.rng(r);
        const n = meta.unlocked.includes('treasureHunter') ? 4 : 3;
        r.pendingAugments = g.shuffle(AUGMENT_IDS.filter(a => !r.augments.includes(a))).slice(0, n);
        Run.save(r, g);
        r.stage = 'augment';
        return 'augment';
      }
      Run.nextFight(r);
      return 'preFight';

function allyHTML(a) {
  if (!a) return '';
  const col = a.side === 'player' ? COL.paper : COL.blood;
  return `<div class="ally ${a.side}">${a.fresh ? '<span class="fresh">attacks next turn</span>' : ''}${sigil(a.cardID || a.minion || a.name, col, { eye: a.side === 'enemy', lw: 2.4 })}
<div class="an">${esc(a.name)}</div><div class="p">${a.power}</div><div class="h">${Math.max(0, a.health)}</div></div>`;
}
function render(sn) {
  $('#rnd').textContent = sn.round || 1;
  $('#it').textContent = sn.intent[0]; $('#id').textContent = sn.intent[1];
  $('#ehp').style.width = Math.max(0, Math.min(100, 100 * sn.enemyHP / sn.enemyMaxHP)) + '%';
  $('#ehpt').textContent = `${Math.max(0, sn.enemyHP)} / ${sn.enemyMaxHP}`;
  const cb = $('#combo'), td = sn.turnDamage || 0;
  if (cb) {

      cb.style.opacity = td > 0 ? 1 : 0;
      if (td > 0) { cb.querySelector('b').textContent = td; cb.style.setProperty('--cs', Math.round(22 + Math.min(30, Math.sqrt(td) * 3)) + 'px'); cb.classList.toggle('hot', td >= 40); anim(cb.querySelector('b'), 'pop'); }
      view.lastCombo = td;
    }
  }
  $('#est').textContent = sn.status;
  $('#eb').innerHTML = sn.enemyBlock > 0 ? `<div class="stat" style="font-size:16px"><span style="width:20px">${ICON.shield(COL.frost)}</span>${sn.enemyBlock}</div>` : '';
  for (const side of ['player', 'enemy']) {
    const slot = $('#slot-' + side), a = sn.allies[side];
    const cur = slot.querySelector('.ally');
    if (!a) { if (cur) cur.remove(); slot.querySelector('.empty').style.display = ''; continue; }
    slot.querySelector('.empty').style.display = 'none';
    if (cur && +cur.dataset.id === a.id) {

      const fr = cur.querySelector('.fresh'); if (fr && !a.fresh) fr.remove();

    }
  }
  $('#hp').className = 'stat' + (sn.hp / sn.maxHP < .3 ? ' low' : '');
  $('#hp').innerHTML = `<span style="width:18px">${ICON.heart(COL.blood)}</span>${Math.max(0, sn.hp)}/${sn.maxHP}`;
  $('#blk').innerHTML = sn.block > 0 ? `<span style="width:20px">${ICON.shield(COL.frost)}</span>${sn.block}` : '';
  $('#en').innerHTML = `<span style="width:18px">${ICON.flame(COL.ember)}</span>${sn.energy}/${sn.maxE}`;
  $('#pips').innerHTML = [...Array(sn.ashNeeded)].map((_, i) => `<i class="${i < sn.ash ? 'on' : ''}"></i>`).join('');
  const burn = $('#burn'); burn.className = 'side-btn ' + (sn.canBurn ? 'ready' : 'off');
  $('#burnl').textContent = sn.canBurn ? `BURN ${sn.burnDamage}` : 'BURN';
  $('#stoke').className = 'side-btn ' + (sn.canStoke ? '' : 'off');
  $('#stokecap').textContent = `${sn.stokePrice} energy: +1 Ash`;
  $('#arts').innerHTML = [...Array(MAX_ARTIFACTS)].map((_, i) => {
    const a = sn.artifacts[i];
    return a ? `<div class="art-slot has" data-uid="${a.uid}" data-id="${a.id}" data-lvl="${a.lvl || 0}">${sigil(a.id, COL.gold, { ring: false, lw: 3 })}${a.charges > 0 ? `<span class="ch">${a.charges}</span>` : ''}</div>` : '<div class="art-slot"></div>';
  }).join('');
  document.querySelectorAll('#arts .art-slot.has').forEach(el => el.onclick = () => { const d = card(el.dataset.id), l = +el.dataset.lvl; toast(`${d.name}${l ? ' ' + '★'.repeat(l) : ''}: ${cardText(d.id, l)}`, COL.gold); });
  $('#pd').textContent = `Deck ${sn.drawCount}`; $('#pu').textContent = `Used ${sn.discardCount}`;
  renderHand(sn);
}
function renderHand(sn) {
  const h = $('#hand'); if (!h) return;
  const n = sn.hand.length, cw = h.querySelector('.card')?.offsetWidth || Math.min(76, (innerWidth - 18) / 5.15);
  const avail = Math.min(innerWidth, 520) - 20;
  const ov = n > 1 ? Math.min(4, (avail - n * cw) / (n - 1)) : 0;
  h.style.setProperty('--ov', ov + 'px');
  h.innerHTML = sn.hand.map(c => {
    const playable = !view.busy && B.outcome === 'ongoing' && card(c.id).cost <= sn.energy;
    const cls = [view.sel === c.uid ? 'sel' : '', playable ? '' : 'off', view.known.has(c.uid) ? '' : 'new'].join(' ');
    return cardHTML(c.id, { uid: c.uid, lvl: c.lvl, cls, attr: 'role="button" tabindex="0"' });
  }).join('');
  sn.hand.forEach(c => view.known.add(c.uid));
  h.querySelectorAll('.card').forEach(el => el.onclick = e => { e.stopPropagation(); tapCard(+el.dataset.uid, el); });
  $('#hint').textContent = view.sel != null ? 'Tap again to play' : '';
}
function tapCard(uid, el) {
  if (view.busy || view.done) return;
  const c = B.hand.find(x => x.uid === uid); if (!c) return;
  const why = B.blockedReason(c);
  if (why) { anim(el, 'shake'); toast(why, COL.blood); buzz(30); view.sel = null; renderHand(B.snapshot()); return; }
  if (view.sel === uid) {
    view.sel = null; buzz(10);
    Sound.play(card(c.id).type === 'creature' ? 'summon' : 'card');
    B.play(uid); play(B.takeEvents());
  } else { view.sel = uid; Sound.play('card'); renderHand(B.snapshot()); }
}
function doEndTurn() { if (view.busy || view.done) return; view.sel = null; buzz(15); B.endTurn(); play(B.takeEvents()); }
function doStoke() {
  if (view.busy || view.done) return;
  if (!B.canStoke) { toast(B.stokedThisTurn ? 'Already stoked this turn.' : B.ash >= B.ashNeeded ? 'Ash is full. Burn!' : `Stoke costs ${B.stokePrice} energy.`, COL.ash); return; }
  B.stoke(); play(B.takeEvents());
}
function doBurn() {
  if (view.busy || view.done) return;
  if (!B.canBurn) { toast(`Burn needs ${B.ashNeeded} Ash. Gain Ash when your creature dies, or Stoke.`, COL.ash); return; }
  buzz(40); B.useBurn(); play(B.takeEvents());
}
const DUR = { allyIn: 260, allyAttacks: 220, allyHit: 200, allyChanged: 100, allyDied: 280, faceHit: 240, block: 60, healed: 150, ash: 100,
              energy: 0, hand: 40, artifacts: 150, artifactFires: 200, status: 80, enemyActs: 600, burn: 550, info: 480 };
async function play(events) {
  view.busy = true; $('#end').disabled = true;
  for (const ev of events) {
    const sn = ev.snap;
    switch (ev.type) {
      case 'allyAttacks': anim($(`#slot-${ev.side} .ally`), ev.side === 'player' ? 'lunge-up' : 'lunge-down'); break;
      case 'allyHit': { const n = $(`#slot-${ev.side} .ally`); anim(n, 'shake'); floatAt(n, `-${ev.amount}`, COL.blood, numSize(ev.amount)); Sound.play('hit'); break; }
      case 'allyDied': {
        const n = $(`#slot-${ev.side} .ally`);
        if (n) { n.classList.add('die'); if (ev.side === 'player') floatAt(n, '+1 Ash', COL.ash, 16); await sleep(240); }
        Sound.play('death'); break;
      }
      case 'faceHit':
        if (ev.side === 'enemy') {
          const big = ev.amount >= 20;
          anim($('#cmd'), 'shake'); floatAt($('#cmd'), `-${ev.amount}`, COL.blood, numSize(ev.amount) + 4, big ? 'crit' : '');
          if (big) { anim($('#bt'), 'quake'); flash(COL.ember, Math.min(.35, .12 + ev.amount / 300)); buzz(Math.min(80, 20 + ev.amount)); }
        }
        else { anim($('#hp'), 'shake'); floatAt($('#hp'), `-${ev.amount}`, COL.blood, numSize(ev.amount)); flash(COL.blood, .16); buzz(25); }
        Sound.play('hit'); break;
      case 'healed': floatAt(ev.side === 'enemy' ? $('#cmd') : $('#hp'), `+${ev.amount}`, COL.heal); break;
      case 'block': if (ev.value > 0) Sound.play('shield'); break;
      case 'ash': Sound.play('ash'); break;
      case 'allyIn': Sound.play('summon'); break;
      case 'enemyActs': anim($('#cmd'), 'pop'); banner(ev.text, COL.blood, .3, 700); Sound.play('enemy'); break;
      case 'burn': flash(COL.ember, .35); anim($('#bt'), 'quake'); banner(`BURN!  ${ev.amount}`, COL.ember, .55, 700); Sound.play('burn'); break;
      case 'info': banner(ev.text, COL.paper, .45, 650); break;
      case 'artifacts': Sound.play('shield'); break;
    }
    if (sn) render(sn);
    if (ev.type === 'artifactFires') anim($(`#arts [data-uid="${ev.uid}"]`), 'pop');
    if (ev.type === 'allyChanged') anim($('#slot-player .ally .p'), 'pop');
    const d = DUR[ev.type] || 0; if (d) await sleep(d);
  }
  view.busy = false;
  render(B.snapshot());
  $('#end').disabled = B.outcome !== 'ongoing';
  if (B.outcome === 'won') winBattle(); else if (B.outcome === 'lost') loseBattle();
}
async function winBattle() {
  if (view.done) return; view.done = true;
  Sound.play('victory'); buzz(60);
  const final = Run.isFinal(G.run);
  $('#cmd svg').style.transition = 'transform .6s, opacity .6s'; $('#cmd svg').style.transform = 'scale(1.6)'; $('#cmd svg').style.opacity = 0;
  banner(final ? 'The Final Pyre falls!' : 'Victory', COL.ember, .5, 1300);
  if (final) G.run.ashEarned += B.ashGainedTotal; else Run.winFight(G.run, B, G.meta);
  Store.save();
  await sleep(1500);
  if (final) { G.run.bestTurn = Math.max(G.run.bestTurn || 0, B.bestTurn); const fight = G.run.fight, bt = G.run.bestTurn; const banked = endRun(true); Sound.play('unlock'); showEnd(true, fight, banked, null, bt); }
  else showReward();
}
async function loseBattle() {
  if (view.done) return; view.done = true;
  Sound.play('defeat'); flash(COL.blood, .4); buzz(200);
  banner('The pyre claims you.', COL.blood, .5, 1600);
  G.run.ashEarned += B.ashGainedTotal;
  G.run.bestTurn = Math.max(G.run.bestTurn || 0, B.bestTurn);
  const fight = G.run.fight, killer = B.enemy.name, bt = G.run.bestTurn;
  await sleep(2000);
  const banked = endRun(false);
  showEnd(false, fight, banked, killer, bt);

  }, 260);
}

document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
(async () => {
  app.innerHTML = '<div class="loading">Kindling…</div>';
  embers();
  await Store.load();
  showMenu();
})();
}

</script>
